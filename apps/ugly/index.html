<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenFlyLog</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/main.js" defer></script>
  </head>
  <body>
    <div class="container">
      <section id="login-view" class="card">
        <h1>Sign in</h1>
        <form id="login-form">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
          />
          <button type="submit">Request one-time-passcode</button>
          <p id="login-error" class="error hidden"></p>
        </form>
      </section>
      <section id="otp-view" class="hidden card">
        <h1>Provide the OTP</h1>
        <p>You should have received a passcode in your inbox.</p>
        <form id="otp-form">
          <label for="otp"></label>
          <input id="otp" required type="text" autocomplete="off" />
          <p id="otp-error" class="error hidden"></p>
          <button type="submit">Submit</button>
        </form>
      </section>
      <section id="dashboard-view" class="hidden">
        <h1>Your flights</h1>
        <table id="flights-table">
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Ident</th>
            <th>From</th>
            <th>To</th>
            <th>Total</th>
            <th>Remarks</th>
          </tr>
          <tbody></tbody>
        </table>
        <div id="pagination" class="pagination-container">
          <button id="page-back-btn" class="hidden"><</button>
          <span>
            Page <strong id="current-page"></strong> of
            <strong id="total-pages"></strong>
          </span>
          <button id="page-next-btn" class="hidden">></button>
        </div>
        <button id="logout-btn">Log out</button>
      </section>
    </div>
  </body>
</html>
