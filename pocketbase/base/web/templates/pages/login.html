{{define "login-content"}}
<h1>Log in</h1>

<form hx-post="/login" hx-target="#error">
  <input type="email" name="email" />
  <input type="password" name="password" />
  <button type="submit">Log in</button>
</form>
<div id="error"></div>
{{end}} {{define "login-error"}}
<p class="error">{{.Error}}</p>
{{end}}
